<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Staff & Items Trainer</title>
  <link rel="stylesheet" href="../assets/css/reception-scene.css">
  <style>
    :root {
      --ink: #172126;
      --muted: #5f6e74;
      --paper: #f8f7f2;
      --line: #d8dfd9;
      --brand: #126c76;
      --brand-dark: #0b4e56;
      --green: #1f8a5b;
      --red: #c74432;
      --blue: #2d6ca2;
      --gold: #efb84a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(130deg, rgba(18, 108, 118, .12), transparent 36%),
        linear-gradient(310deg, rgba(199, 68, 50, .10), transparent 31%),
        var(--paper);
    }

    button { font: inherit; color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 24px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 10px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      color: var(--brand-dark);
      font-weight: 900;
      text-decoration: none;
    }

    .back svg, .icon-btn svg, .btn svg { width: 18px; height: 18px; }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 56px);
      line-height: .98;
      letter-spacing: 0;
    }

    .score {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
    }

    .pill, .btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .84);
      padding: 7px 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 900;
      white-space: nowrap;
    }

    .pill span { color: var(--muted); font-weight: 750; }
    .btn { cursor: pointer; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .tab {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      padding: 8px;
      cursor: pointer;
      font-weight: 950;
    }

    .tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .stage {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 18px 48px rgba(23, 33, 38, .12);
      overflow: hidden;
    }

    .scene {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(18, 108, 118, .08), rgba(255, 255, 255, .68));
    }

    .art {
      min-height: 136px;
      border-radius: 8px;
      border: 1px solid rgba(18, 108, 118, .18);
      background: #eef6f4;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .art svg { width: 100%; height: 100%; min-height: 136px; display: block; }
    .art img { display:block; width:100%; height:100%; max-height:200px; object-fit:cover; }
    .result { padding:clamp(16px, 4vw, 36px); }
    .result-score { font-size:clamp(32px, 7vw, 52px); font-weight:900; margin:.4rem 0; color:var(--brand-dark); }
    .result label { display:block; font-weight:700; margin:1rem 0 .25rem; }
    .result input { width:min(100%, 24rem); padding:.65rem; border:1px solid var(--line); border-radius:6px; font:inherit; }
    .result-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:1rem; }
    #quiz[hidden], #result[hidden], #art[hidden] { display:none; }
    .btn:disabled { opacity:.55; cursor:default; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
    .tag {
      border-radius: 8px;
      padding: 5px 8px;
      background: rgba(18, 108, 118, .10);
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .title {
      margin: 0;
      font-size: clamp(22px, 3.3vw, 36px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .prompt {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.35;
    }

    .target {
      margin-top: 10px;
      border: 1px solid rgba(18, 108, 118, .22);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .target-text {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 950;
    }

    .target-ru {
      display: none;
    }

    .actions { display: flex; gap: 7px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .options {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice {
      min-height: 96px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      padding: 11px;
      text-align: left;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .choice:hover { border-color: rgba(18, 108, 118, .48); }
    .choice[disabled] { cursor: default; opacity: .72; }
    .choice.correct { opacity: 1; border-color: rgba(31, 138, 91, .88); background: rgba(31, 138, 91, .08); }
    .choice.wrong { opacity: 1; border-color: rgba(199, 68, 50, .86); background: rgba(199, 68, 50, .08); }

    .emoji {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: rgba(45, 108, 162, .10);
      display: grid;
      place-items: center;
      font-size: 24px;
    }

    .en { display: block; font-size: 17px; font-weight: 950; line-height: 1.2; overflow-wrap: anywhere; }
    .ru { display: none; }

    .feedback {
      display: none;
      margin: 0 12px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 11px;
      font-weight: 900;
    }

    .feedback.show { display: block; }
    .feedback.good { border-color: rgba(31, 138, 91, .45); background: rgba(31, 138, 91, .08); color: var(--green); }
    .feedback.bad { border-color: rgba(199, 68, 50, .42); background: rgba(199, 68, 50, .08); color: var(--red); }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 9px;
      padding: 0 12px 12px;
    }

    @media (max-width: 900px) {
      .top, .scene { grid-template-columns: 1fr; }
      .score { justify-content: flex-start; }
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 10px, 1180px); padding-top: 8px; }
      .top { gap: 8px; margin-bottom: 8px; }
      .back { margin-bottom: 5px; font-size: 14px; }
      h1 { font-size: 24px; }
      .score { gap: 6px; }
      .pill, .btn { min-height: 34px; padding: 6px 9px; font-size: 13px; }
      .tabs { gap: 5px; margin: 8px 0; }
      .tab { min-height: 42px; padding: 6px 4px; font-size: 12px; }
      .scene { padding: 10px; gap: 8px; }
      .art { display: none; }
      .tag-row { gap: 5px; margin-bottom: 6px; }
      .tag { font-size: 11px; padding: 4px 6px; }
      .title { font-size: 21px; }
      .prompt { margin-top: 5px; font-size: 14px; }
      .target { margin-top: 8px; padding: 9px; }
      .target-text { font-size: 17px; }
      .target-ru { font-size: 11px; }
      .icon-btn { width: 34px; height: 34px; }
      .options { gap: 7px; padding: 8px; }
      .choice { min-height: 82px; grid-template-columns: 30px minmax(0, 1fr); gap: 7px; padding: 8px; }
      .emoji { width: 30px; height: 30px; font-size: 18px; }
      .en { font-size: 13px; }
      .ru { font-size: 11px; margin-top: 3px; }
      .feedback { margin: 0 8px 8px; padding: 9px; font-size: 13px; }
      .nav { padding: 0 8px 8px; }
    }
    #receptionScene { margin: 14px 14px 0; overflow: hidden; border-radius: 8px; }
    #receptionScene[hidden], .scene.desk-scene #art { display: none; }
    #receptionScene .reception-viewport { height: clamp(280px, 40vw, 500px); }
    .scene.desk-scene { grid-template-columns: minmax(0, 1fr); }
    .feedback { display: block; visibility: hidden; min-height: 65px; }
    .feedback.show { visibility: visible; }
    @media (max-width: 620px) {
      #receptionScene { margin: 8px 8px 0; }
      #receptionScene .reception-viewport { height: 200px; }
      .shell { padding: 6px 0 10px; }
      .back { margin-bottom: 3px; font-size: 12px; }
      h1 { font-size: 21px; }
      .top { gap: 5px; margin-bottom: 5px; }
      .pill, .btn { min-height: 30px; padding: 5px 8px; font-size: 12px; }
      .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin: 6px 0; }
      .tab { min-height: 36px; font-size: 10px; padding: 5px 2px; }
      .scene { padding: 8px; gap: 5px; }
      .tag-row { margin-bottom: 5px; }
      .tag { padding: 3px 5px; font-size: 10px; }
      .title { font-size: 19px; }
      .prompt { margin-top: 4px; font-size: 13px; line-height: 1.3; }
      .target { margin-top: 6px; padding: 7px; }
      .target-text { font-size: 15px; line-height: 1.3; }
      .icon-btn { width: 28px; height: 28px; }
      .options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 7px; }
      .options.replies { grid-template-columns: minmax(0, 1fr); }
      .choice { min-height: 65px; grid-template-columns: 22px minmax(0, 1fr); padding: 7px; gap: 5px; }
      .emoji { width: 22px; height: 22px; font-size: 16px; }
      .en { font-size: 12px; line-height: 1.25; }
      .feedback { min-height: 60px; padding: 7px; margin: 0 7px 7px; font-size: 12px; }
      .nav { padding: 0 7px 7px; }
      .art.with-photo { display:block; min-height:0; }
      .art.with-photo img { height:clamp(65px, 20vw, 105px); object-position:center 43%; }
    }
    @media (max-width: 620px) and (max-height: 900px) {
      #receptionScene .reception-viewport { height: 140px; min-height: 140px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <a class="back" href="/tourism_hub/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
          Hub
        </a>
        <h1>Hotel Staff & Items</h1>
      </div>
      <div class="score">
        <div class="pill"><span>Score</span><strong id="score">0</strong></div>
        <div class="pill"><span>Done</span><strong id="done">0</strong></div>
        <button class="btn" id="resetBtn" type="button">Restart set</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Modes">
      <button class="tab active" type="button" data-mode="staff">Staff</button>
      <button class="tab" type="button" data-mode="desk">Front Desk</button>
      <button class="tab" type="button" data-mode="room">Room</button>
      <button class="tab" type="button" data-mode="bathroom">Bathroom</button>
      <button class="tab" type="button" data-mode="actions">Actions</button>
      <button class="tab" type="button" data-mode="requests">Guest Requests</button>
    </nav>

    <section class="stage" id="quiz">
      <div id="receptionScene" aria-hidden="true" hidden></div>
      <div class="scene">
        <div class="art" id="art"></div>
        <div>
          <div class="tag-row">
            <span class="tag" id="modeTag">Staff</span>
            <span class="tag" id="stepTag">1 / 10</span>
            <span class="tag" id="roleTag" hidden>You: receptionist</span>
          </div>
          <h2 class="title" id="title" tabindex="-1">Staff</h2>
          <p class="prompt" id="prompt">Choose the correct card.</p>
          <div class="target">
            <p class="target-text"><span id="targetText">Who checks guests in?</span><span class="target-ru" id="targetRu">Кто заселяет гостей?</span></p>
            <div class="actions">
              <button class="icon-btn" id="speakBtn" type="button" title="Listen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" role="status"></div>

      <div class="nav">
        <button class="btn primary" id="nextBtn" type="button" disabled>Next</button>
      </div>
    </section>
    <section class="stage result" id="result" aria-labelledby="resultTitle" hidden>
      <h2 class="title" id="resultTitle" tabindex="-1"></h2>
      <p class="result-score" id="finalScore"></p>
      <p id="resultDetails"></p>
      <p id="overallResult" hidden></p>
      <p id="completedAt"></p>
      <label for="studentName">Name for your result (optional)</label>
      <input id="studentName" maxlength="80" autocomplete="name">
      <p>Show this screen to your teacher, take a screenshot or copy the result.</p>
      <div class="result-actions">
        <button class="btn primary" type="button" id="copyResult">Copy result</button>
        <button class="btn" type="button" id="nextSet">Next set</button>
      </div>
      <p id="copyStatus" role="status"></p>
    </section>
  </main>

  <script src="../assets/js/reception-scene.js?v=2"></script>
  <script src="../assets/js/hospitality-glossary.js"></script>
  <script>
    const art = {

      room: '<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="160" fill="#eef2f8"/><rect x="36" y="78" width="148" height="48" rx="8" fill="#2d6ca2"/><rect x="50" y="55" width="55" height="28" rx="6" fill="#fff"/><rect x="112" y="55" width="55" height="28" rx="6" fill="#fff"/><path d="M42 126h136" stroke="#172126" stroke-width="6" stroke-linecap="round"/></svg>',

      ],
      room: [

      ],

        ['Wash hands.', 'Мыло', 'soap', 'мыло', [['soap', 'мыло', '🧼'], ['toothbrush', 'зубная щетка', '🪥'], ['toothpaste', 'паста', '🪥'], ['shower cap', 'шапочка', '🧢']]],
        ['Wash hair.', 'Шампунь', 'shampoo', 'шампунь', [['shampoo', 'шампунь', '🧴'], ['conditioner', 'кондиционер для волос', '🧴'], ['body wash', 'гель для душа', '🧴'], ['tissue box', 'салфетки', '⬜']]],
        ['After shampoo.', 'Кондиционер для волос', 'conditioner', 'кондиционер', [['conditioner', 'кондиционер', '🧴'], ['air conditioner', 'кондиционер', '❄️'], ['soap', 'мыло', '🧼'], ['bathrobe', 'халат', '🥼']]],
        ['Dry hair.', 'Фен', 'hair dryer', 'фен', [['hair dryer', 'фен', '💨'], ['iron', 'утюг', '👕'], ['kettle', 'чайник', '☕'], ['remote control', 'пульт', '🎛️']]],
        ['Wear after shower.', 'Халат', 'bathrobe', 'халат', [['bathrobe', 'халат', '🥼'], ['blanket', 'плед', '🛏️'], ['sheet', 'простыня', '🛏️'], ['hanger', 'вешалка', '🧥']]],
        ['Floor near bath.', 'Коврик', 'bath mat', 'коврик', [['bath mat', 'коврик', '⬜'], ['carpet', 'ковер', '◼️'], ['towel', 'полотенце', '🧺'], ['pillow', 'подушка', '🛏️']]],
        ['Brush teeth.', 'Зубная щетка', 'toothbrush', 'зубная щетка', [['toothbrush', 'зубная щетка', '🪥'], ['toothpaste', 'паста', '🪥'], ['razor', 'бритва', '🪒'], ['soap', 'мыло', '🧼']]],
        ['Use with toothbrush.', 'Зубная паста', 'toothpaste', 'зубная паста', [['toothpaste', 'зубная паста', '🪥'], ['body wash', 'гель для душа', '🧴'], ['shampoo', 'шампунь', '🧴'], ['tissue box', 'салфетки', '⬜']]],
        ['Shave.', 'Бритва', 'razor', 'бритва', [['razor', 'бритва', '🪒'], ['shower cap', 'шапочка', '🧢'], ['hair dryer', 'фен', '💨'], ['bathrobe', 'халат', '🥼']]]
      ],
      actions: [
        ['Move the guest to a higher room category.', 'Повысить категорию номера', 'upgrade the room', 'сделать апгрейд', [['upgrade the room', 'сделать апгрейд', '⬆️'], ['change the towel', 'заменить полотенце', '🧺'], ['print the receipt', 'распечатать чек', '🧾'], ['call security', 'позвать охрану', '🛡️']]],
        ['New room.', 'Поменять номер', 'change the room', 'поменять номер', [['change the room', 'поменять номер', '🔁'], ['store luggage', 'оставить багаж', '🧳'], ['book a taxi', 'заказать такси', '🚕'], ['serve breakfast', 'подать завтрак', '🍽️']]],
        ['Keep bags.', 'Оставить багаж', 'store luggage', 'оставить багаж', [['store luggage', 'оставить багаж', '🧳'], ['copy the passport', 'скопировать паспорт', '🛂'], ['send towels', 'отправить полотенца', '🧺'], ['fix the AC', 'починить кондиционер', '❄️']]],
        ['Make paper copy.', 'Скопировать паспорт', 'copy the passport', 'скопировать паспорт', [['copy the passport', 'скопировать паспорт', '🛂'], ['print the receipt', 'распечатать чек', '🧾'], ['recode the key card', 'перекодировать карту', '💳'], ['clean the room', 'убрать номер', '🧹']]],
        ['Door card problem.', 'Перекодировать карту', 'recode the key card', 'перекодировать карту', [['recode the key card', 'перекодировать карту', '💳'], ['book a table', 'забронировать стол', '🍽️'], ['call a doctor', 'вызвать врача', '🩺'], ['send housekeeping', 'отправить уборку', '🧹']]],
        ['Dirty room.', 'Отправить уборку', 'send housekeeping', 'отправить уборку', [['send housekeeping', 'отправить уборку', '🧹'], ['call maintenance', 'позвать техника', '🔧'], ['call security', 'позвать охрану', '🛡️'], ['book a taxi', 'заказать такси', '🚕']]],
        ['Broken shower.', 'Позвать техника', 'call maintenance', 'позвать техника', [['call maintenance', 'позвать техника', '🔧'], ['serve breakfast', 'подать завтрак', '🍽️'], ['store luggage', 'оставить багаж', '🧳'], ['print the receipt', 'распечатать чек', '🧾']]],
        ['Loud guests.', 'Позвать охрану', 'call security', 'позвать охрану', [['call security', 'позвать охрану', '🛡️'], ['change the sheet', 'заменить простыню', '🛏️'], ['copy the passport', 'скопировать паспорт', '🛂'], ['upgrade the room', 'сделать апгрейд', '⬆️']]],
        ['Airport ride.', 'Заказать такси', 'book a taxi', 'заказать такси', [['book a taxi', 'заказать такси', '🚕'], ['book a table', 'забронировать стол', '🍽️'], ['send towels', 'отправить полотенца', '🧺'], ['fix the safe', 'починить сейф', '🔐']]],
        ['Paper after payment.', 'Распечатать чек', 'print the receipt', 'распечатать чек', [['print the receipt', 'распечатать чек', '🧾'], ['serve breakfast', 'подать завтрак', '🍽️'], ['change the room', 'поменять номер', '🔁'], ['call a doctor', 'вызвать врача', '🩺']]]
      ]
    };

    const guestCases = [
      {
        request: 'Room 406: “Could we have two clean towels, please?”',
        roles: ['housekeeper', 'maintenance technician', 'bell attendant'],
        replies: ['I’ll ask housekeeping to bring two towels to Room 406.', 'I’ll ask housekeeping to bring two pillows to Room 406.', 'I’ll ask someone to bring one towel to Room 604.'],
        reason: 'The guest needs two towels in Room 406.'
      },
      {
        request: 'Room 318: “The reading lamp won’t turn on.”',
        roles: ['maintenance technician', 'concierge', 'restaurant supervisor'],
        replies: ['I’ll ask our technician to check the lamp. When is a good time?', 'I’ll send you a new room key.', 'The lamp is fixed. You can use it now.'],
        reason: 'Arrange a check and confirm when the technician can enter.'
      },
      {
        request: 'Lobby: “Can someone bring our bags up to Room 212?”',
        roles: ['bell attendant', 'security officer', 'housekeeper'],
        replies: ['I’ll ask our bell attendant to help. How many bags do you have?', 'I’ll ask you to collect the bags from the restaurant.', 'I’ll send the bags to Room 221.'],
        reason: 'Confirm the number of bags before handing over the request.'
      },
      {
        request: 'Front desk: “It’s raining. Is there somewhere nearby to visit indoors?”',
        roles: ['concierge', 'restaurant supervisor', 'maintenance technician'],
        replies: ['Our concierge can suggest an indoor place. How much time do you have?', 'You can take a walk by the lake.', 'I’ll book a three-hour tour for you right away.'],
        reason: 'Check how much time they have before suggesting a place.'
      },
      {
        request: 'Room 520: “Someone keeps trying our door handle.”',
        roles: ['security officer', 'bell attendant', 'concierge'],
        replies: ['Please stay in your room. I’ll contact security now.', 'Please open the door and ask who it is.', 'Wait until morning and tell the next shift.'],
        reason: 'Contact security promptly and keep the guest away from the possible threat.'
      },
      {
        request: 'Restaurant: “Can our group of six get a high chair at 19:30?”',
        roles: ['restaurant supervisor', 'housekeeper', 'maintenance technician'],
        replies: ['I’ll check with the restaurant about a high chair for your table at 19:30.', 'Your table for three is confirmed for 18:30.', 'We can guarantee a high chair, even though I haven’t checked.'],
        reason: 'Pass on the correct time and confirm availability before promising.'
      }
    ];

    const jobIcons = {
      housekeeper: '🧹', 'maintenance technician': '🔧', 'bell attendant': '🧳',
      concierge: '🗺️', 'restaurant supervisor': '🍽️', 'security officer': '🛡️'
    };
    data.requests = guestCases.flatMap(({ request, roles, replies, reason }) => [
      [request, '', roles[0], '', roles.map(role => [role, '', jobIcons[role]])],
      [request, '', replies[0], '', replies.map(reply => [reply, '', '💬']), reason]
    ]);

    const $ = id => document.getElementById(id);
    const tabs = [...document.querySelectorAll('.tab')];
    const modes = tabs.map(tab => tab.dataset.mode);
    const scene = new ReceptionScene($('receptionScene'));
    const deskRoles = { desk: 'guest', actions: 'receptionist' };
    const photos = {
      staff: ['hotel-crew.webp', 'Eight people working in a hotel'],
      requests: ['hotel-lobby.webp', 'Guests and staff in a busy hotel lobby']
    };
    const storageKey = 'hotel-items-attempts-v2';
    const state = { mode: 'staff', index: 0, answered: false, attempts: {}, name: '' };
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
      for (const mode of modes) {
        const attempt = saved.attempts?.[mode];
        if (Array.isArray(attempt?.answers) && attempt.answers.length <= data[mode].length &&
            attempt.answers.every(answer => typeof answer === 'boolean')) {
          state.attempts[mode] = attempt;
        }
      }
      if (modes.includes(saved.mode)) state.mode = saved.mode;
      if (typeof saved.name === 'string') state.name = saved.name.slice(0, 80);
    } catch { /* Practice still works when storage is unavailable. */ }

    function items() { return data[state.mode]; }
    function current() { return items()[state.index]; }
    function attempt() { return state.attempts[state.mode] ??= { answers: [] }; }
    function tabLabel(mode = state.mode) {
      return tabs.find(tab => tab.dataset.mode === mode).textContent;
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({
          mode: state.mode, attempts: state.attempts, name: state.name
        }));
      } catch { /* Keep the current attempt in memory. */ }
    }

    function updateCounters() {
      const { answers } = attempt();
      $('score').textContent = answers.filter(Boolean).length + ' / ' + items().length;
      $('done').textContent = answers.length + ' / ' + items().length;
    }

    function stopTaskMedia() {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      scene.stop();
    }

    function responseAction(response) {
      const text = response.toLowerCase();
      if (/\b(scan|copy)\b.*\bpassport\b/.test(text)) return 'scan';
      if (/\bsign\b/.test(text)) return 'sign';
      if (/\b(call|send)\b/.test(text)) return 'call';
      if (/\b(key|recode)\b/.test(text)) return 'key';
      if (/\bpassport\b/.test(text)) return 'passport';
      if (/\b(receipt|invoice)\b/.test(text)) return 'receipt';
      if (/\b(credit card|deposit|payment)\b/.test(text)) return 'payment';
      if (/\bluggage\b/.test(text)) return 'luggage';
      if (/\b(reservation|book|upgrade|change the room)\b/.test(text)) return 'booking';
      return null;
    }

    function shuffle(list) {
      const shuffled = [...list];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function showResult(focus) {
      const { answers, finishedAt } = attempt();
      const correct = answers.filter(Boolean).length;
      $('quiz').hidden = true;
      $('result').hidden = false;
      $('resultTitle').textContent = tabLabel() + ' · Result';
      $('finalScore').textContent = correct + ' / ' + items().length + ' correct';
      if (state.mode === 'requests') {
        const roles = answers.filter((ok, i) => ok && i % 2 === 0).length;
        const replies = correct - roles;
        $('resultDetails').textContent = 'Staff choices: ' + roles + ' / ' + guestCases.length +
          ' · Guest replies: ' + replies + ' / ' + guestCases.length;
      } else {
        $('resultDetails').textContent = Math.round(correct / items().length * 100) + '%';
      }
      const date = new Date(finishedAt);
      $('completedAt').textContent = Number.isFinite(date.getTime()) ? date.toLocaleString() : '';
      $('studentName').value = state.name;
      $('copyStatus').textContent = '';
      const next = modes.find(mode => state.attempts[mode]?.answers.length !== data[mode].length);
      $('nextSet').hidden = !next;
      $('overallResult').hidden = Boolean(next);
      if (!next) {
        const allAnswers = modes.flatMap(mode => state.attempts[mode].answers);
        $('overallResult').textContent = 'All six sets: ' + allAnswers.filter(Boolean).length +
          ' / ' + allAnswers.length + ' correct';
      }
      if (next) {
        $('nextSet').textContent = 'Next: ' + tabLabel(next);
        $('nextSet').onclick = () => selectMode(next, true);
      }
      if (focus) $('resultTitle').focus();
    }

    function renderScene() {
      const role = deskRoles[state.mode];
      const photo = photos[state.mode];
      const artBox = $('art');
      $('receptionScene').hidden = !role;
      document.querySelector('.scene').classList.toggle('desk-scene', Boolean(role));
      $('roleTag').hidden = !role;
      artBox.hidden = Boolean(role);
      artBox.classList.toggle('with-photo', Boolean(photo));
      if (role) {
        scene.set({ role, person: 0, mood: 'neutral' });
        $('roleTag').textContent = 'You: ' + role;
        artBox.replaceChildren();
      } else if (photo) {
        if (artBox.dataset.photo !== photo[0]) {
          const image = new Image();
          image.src = photo[0];
          image.alt = photo[1];
          image.decoding = 'async';
          artBox.replaceChildren(image);
        }
      } else {
        artBox.innerHTML = art[state.mode];
      }
      artBox.dataset.photo = photo?.[0] || '';
    }

    function render(focus = false) {
      stopTaskMedia();
      state.index = attempt().answers.length;
      updateCounters();
      if (state.index === items().length) {
        showResult(focus);
        return;
      }
      $('result').hidden = true;
      $('quiz').hidden = false;
      const item = current();
      const isRequest = state.mode === 'requests';
      const isReply = isRequest && state.index % 2 === 1;
      state.answered = false;
      renderScene();
      $('modeTag').textContent = tabLabel();
      $('stepTag').textContent = isRequest
        ? 'Case ' + (Math.floor(state.index / 2) + 1) + ' / ' + guestCases.length + ' · Step ' + (state.index % 2 + 1) + ' / 2'
        : (state.index + 1) + ' / ' + items().length;
      $('title').textContent = isRequest ? (isReply ? 'What would you say?' : 'Who should help?') : tabLabel();
      $('prompt').textContent = isRequest
        ? (isReply ? 'Choose the clearest reply to the guest.' : 'Choose the colleague who can handle this request.')
        : 'Choose the correct card.';
      $('targetText').textContent = item[0];
      window.LangSageGlossary?.decorate($('targetText'));
      $('targetRu').textContent = item[1];
      $('feedback').className = 'feedback';
      $('feedback').textContent = '';
      $('nextBtn').disabled = true;
      $('nextBtn').textContent = 'Next';
      $('options').classList.toggle('replies', isReply);
      $('options').replaceChildren();

      for (const [word, , icon] of shuffle(item[4])) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.dataset.correct = String(word === item[2]);
        const emoji = document.createElement('span');
        emoji.className = 'emoji';
        emoji.setAttribute('aria-hidden', 'true');
        emoji.textContent = icon;
        const label = document.createElement('span');
        label.className = 'en';
        label.textContent = word;
        button.append(emoji, label);
        button.addEventListener('click', () => answer(button));
        $('options').appendChild(button);
      }
      if (focus) $('title').focus();
    }

    function answer(button) {
      if (state.answered) return;
      state.answered = true;
      const correct = button.dataset.correct === 'true';
      stopTaskMedia();
      if (deskRoles[state.mode]) {
        scene.react(correct);
        const action = correct && responseAction(current()[2]);
        if (action) scene.play(action);
      }
      for (const card of document.querySelectorAll('.choice')) {
        card.disabled = true;
        if (card.dataset.correct === 'true') card.classList.add('correct');
      }
      if (!correct) button.classList.add('wrong');
      const progress = attempt();
      progress.answers.push(correct);
      const complete = progress.answers.length === items().length;
      if (complete) progress.finishedAt = new Date().toISOString();
      save();
      updateCounters();
      const feedback = correct ? 'Correct.' : 'Correct answer: ' + current()[2];
      $('feedback').textContent = [feedback, current()[5]].filter(Boolean).join(' ');
      $('feedback').className = 'feedback show ' + (correct ? 'good' : 'bad');
      $('nextBtn').disabled = false;
      $('nextBtn').textContent = complete ? 'See result' : 'Next';
      $('nextBtn').focus({ preventScroll: true });
    }

    function selectMode(mode, focus = false) {
      state.mode = mode;
      for (const tab of tabs) {
        const active = tab.dataset.mode === mode;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-pressed', String(active));
      }
      save();
      render(focus);
    }

    for (const tab of tabs) {
      tab.addEventListener('click', () => selectMode(tab.dataset.mode));
    }
    $('speakBtn').addEventListener('click', () => {
      if (!('speechSynthesis' in window) || !current()) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(current()[0]);
      utterance.lang = 'en-GB';
      utterance.rate = 0.86;
      speechSynthesis.speak(utterance);
    });
    $('nextBtn').addEventListener('click', () => {
      if (state.answered) render(true);
    });
    $('resetBtn').addEventListener('click', () => {
      if (attempt().answers.length && !window.confirm('Restart this set and clear its current result?')) return;
      state.attempts[state.mode] = { answers: [] };
      save();
      render(true);
    });
    $('studentName').addEventListener('input', event => {
      state.name = event.target.value;
      save();
    });
    $('copyResult').addEventListener('click', async () => {
      const lines = [
        'Hotel Staff & Items · ' + tabLabel(), state.name.trim(),
        $('finalScore').textContent, $('resultDetails').textContent,
        $('overallResult').hidden ? '' : $('overallResult').textContent, $('completedAt').textContent
      ].filter(Boolean);
      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        $('copyStatus').textContent = 'Result copied.';
      } catch {
        $('copyStatus').textContent = 'Take a screenshot or show this result to your teacher.';
      }
    });

    window.addEventListener('pagehide', stopTaskMedia);
    selectMode(state.mode);
  </script>
