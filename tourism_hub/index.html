<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tourism English Hub</title>
  <style>
    :root {
      --ink: #172126;
      --muted: #5f6e74;
      --paper: #f8f7f2;
      --panel: #ffffff;
      --line: #d9dfd8;
      --brand: #126c76;
      --brand-dark: #0b4e56;
      --red: #d9482f;
      --gold: #f1b84b;
      --blue: #2d6ca2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(120deg, rgba(18, 108, 118, .12), transparent 34%),
        linear-gradient(300deg, rgba(217, 72, 47, .10), transparent 30%),
        var(--paper);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 32px;
    }

    .hero {
      padding: 8px 0 12px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--brand-dark);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 78px);
      line-height: .96;
      letter-spacing: 0;
      max-width: 850px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      min-height: 104px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .88);
      padding: 16px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      box-shadow: 0 14px 34px rgba(23, 33, 38, .09);
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(18, 108, 118, .45);
      box-shadow: 0 18px 45px rgba(23, 33, 38, .13);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(18, 108, 118, .10);
      color: var(--brand);
    }

    .icon svg {
      width: 28px;
      height: 28px;
    }

    .card h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .tag {
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 5px 8px;
      color: var(--brand-dark);
      background: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 10px, 1120px);
        padding-top: 10px;
      }

      .eyebrow { margin-bottom: 6px; font-size: 11px; }
      h1 { font-size: 29px; }
      .grid { gap: 7px; margin-top: 10px; }

      .card {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 8px;
        min-height: 82px;
        padding: 9px;
      }

      .icon { width: 34px; height: 34px; }
      .icon svg { width: 21px; height: 21px; }
      .card h2 { font-size: 15px; line-height: 1.12; }
      .meta { gap: 4px; margin-top: 7px; }
      .tag { font-size: 10px; padding: 3px 5px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Tourism group</p>
        <h1>English Practice Hub</h1>
      </div>
    </section>

    <section class="grid" aria-label="Training links">
      <a class="card" href="https://langsage.github.io/hospitality_survival_trainer/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11"></path><path d="M8 19v-5h8v5"></path><path d="M9 10h.01"></path><path d="M15 10h.01"></path><path d="M3 19h18"></path></svg>
        </span>
        <span>
          <h2>Hospitality Survival Trainer</h2>
          <span class="meta"><span class="tag">5 levels</span><span class="tag">survival English</span></span>
        </span>
      </a>

      <a class="card" href="https://langsage.github.io/english_trainer/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg>
        </span>
        <span>
          <h2>Number Trainer</h2>
          <span class="meta"><span class="tag">numbers</span><span class="tag">listening</span></span>
        </span>
      </a>

      <a class="card" href="https://langsage.github.io/homework/offliners/question_words/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.6 2.6 0 0 1 5 1.2c0 2-2.5 2-2.5 4"></path><path d="M12 17h.01"></path></svg>
        </span>
        <span>
          <h2>Question Words</h2>
          <span class="meta"><span class="tag">questions</span><span class="tag">A2-B1</span></span>
        </span>
      </a>

      <a class="card" href="https://langsage.github.io/script/pages/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3h8l4 4v14H4V3h4z"></path><path d="M14 3v5h5"></path><path d="M8 13h8"></path><path d="M8 17h6"></path></svg>
        </span>
        <span>
          <h2>Hotel Scripts</h2>
          <span class="meta"><span class="tag">scripts</span><span class="tag">speaking</span></span>
        </span>
      </a>

      <a class="card" href="https://langsage.github.io/hotel_shift_trainer/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h16"></path><path d="M7 10V7a5 5 0 0 1 10 0v3"></path><path d="M5 10v9h14v-9"></path><path d="M9 14h6"></path></svg>
        </span>
        <span>
          <h2>Hotel Shift Trainer</h2>
          <span class="meta"><span class="tag">reception</span><span class="tag">exam mode</span></span>
        </span>
      </a>

      <a class="card" href="https://langsage.github.io/hotel_items_trainer/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v12H4z"></path><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M4 12h16"></path><path d="M9 12v2"></path><path d="M15 12v2"></path></svg>
        </span>
        <span>
          <h2>Hotel Staff & Items</h2>
          <span class="meta"><span class="tag">staff</span><span class="tag">room items</span></span>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
