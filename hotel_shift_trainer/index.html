<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Shift Trainer</title>
  <style>
    :root {
      --ink: #172126;
      --muted: #637178;
      --paper: #fbfaf6;
      --panel: #ffffff;
      --line: #d8ded8;
      --brand: #126c76;
      --brand-dark: #0c4e56;
      --accent: #d9482f;
      --gold: #f3bc4c;
      --green: #1f8a5b;
      --red: #b33a30;
      --blue: #2d6ca2;
      --shadow: 0 18px 55px rgba(20, 34, 38, 0.14);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(18, 108, 118, 0.10), transparent 34%),
        linear-gradient(315deg, rgba(217, 72, 47, 0.10), transparent 30%),
        var(--paper);
    }

    button {
      font: inherit;
      color: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand);
      box-shadow: 0 12px 30px rgba(18, 108, 118, 0.25);
    }

    .mark svg {
      width: 26px;
      height: 26px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 42px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .score-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 750;
      white-space: nowrap;
    }

    .pill span {
      color: var(--muted);
      font-weight: 650;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .tab {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      border-radius: 8px;
      min-height: 50px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .tab svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .tab:hover {
      transform: translateY(-1px);
      border-color: rgba(18, 108, 118, 0.42);
    }

    .tab.active {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .stage {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      overflow: hidden;
    }

    .scene {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(18, 108, 118, 0.08), rgba(255, 255, 255, 0.66));
    }

    .scene-art {
      min-height: 136px;
      border-radius: 8px;
      border: 1px solid rgba(18, 108, 118, 0.18);
      background: #edf6f3;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .scene-art svg {
      width: 100%;
      height: 100%;
      min-height: 136px;
      display: block;
    }

    .tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tag {
      border-radius: 8px;
      padding: 5px 8px;
      background: rgba(18, 108, 118, 0.10);
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 800;
    }

    .task-title {
      margin: 0;
      font-size: clamp(22px, 3.3vw, 36px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .task-ru {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .guest-box {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid rgba(18, 108, 118, 0.25);
      border-radius: 8px;
      background: #fff;
    }

    .guest-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }

    .guest-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 900;
    }

    .spoken {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 800;
    }

    .spoken.hidden-text {
      color: transparent;
      text-shadow: 0 0 9px rgba(23, 33, 38, 0.36);
      user-select: none;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-button {
      min-width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: transform 140ms ease, border-color 140ms ease;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--brand);
    }

    .options {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      min-height: 106px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      padding: 12px;
      text-align: left;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(18, 108, 118, 0.48);
      box-shadow: 0 14px 28px rgba(23, 33, 38, 0.10);
    }

    .card[disabled] {
      cursor: default;
      opacity: 0.72;
      transform: none;
      box-shadow: none;
    }

    .card.correct {
      opacity: 1;
      border-color: rgba(31, 138, 91, 0.85);
      background: rgba(31, 138, 91, 0.08);
    }

    .card.wrong {
      opacity: 1;
      border-color: rgba(179, 58, 48, 0.82);
      background: rgba(179, 58, 48, 0.07);
    }

    .choice-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(45, 108, 162, 0.10);
      color: var(--blue);
    }

    .choice-icon svg {
      width: 28px;
      height: 28px;
    }

    .choice-main {
      min-width: 0;
    }

    .choice-en {
      display: block;
      font-weight: 900;
      line-height: 1.25;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .choice-ru {
      display: block;
      color: var(--muted);
      line-height: 1.35;
      font-size: 14px;
      margin-top: 6px;
    }

    .feedback {
      display: none;
      margin: 0 18px 18px;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      border-color: rgba(31, 138, 91, 0.45);
      background: rgba(31, 138, 91, 0.08);
    }

    .feedback.bad {
      border-color: rgba(179, 58, 48, 0.42);
      background: rgba(179, 58, 48, 0.07);
    }

    .feedback h2 {
      margin: 0 0 6px;
      font-size: 19px;
    }

    .feedback p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 0 18px 18px;
    }

    .primary, .secondary {
      min-height: 46px;
      border-radius: 8px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      font-weight: 900;
    }

    .primary {
      background: var(--brand);
      color: #fff;
    }

    .primary:hover {
      background: var(--brand-dark);
    }

    .secondary {
      background: #fff;
      border-color: var(--line);
    }

    .primary svg, .secondary svg {
      width: 19px;
      height: 19px;
    }

    .exam-result {
      display: none;
      padding: 18px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .exam-result.show {
      display: block;
    }

    .exam-result h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .exam-result p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    @media (max-width: 880px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .score-strip {
        justify-content: flex-start;
      }

      .tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .scene {
        grid-template-columns: 1fr;
      }

      .scene-art {
        min-height: 150px;
      }
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 10px, 1180px); padding-top: 8px; }
      .topbar { gap: 8px; margin-bottom: 8px; }
      .mark { display: none; }
      h1 { font-size: 24px; }
      .score-strip { gap: 6px; }
      .pill, .secondary, .primary { min-height: 34px; padding: 6px 9px; font-size: 13px; }

      .tabs {
        gap: 5px;
        margin: 8px 0;
      }

      .tab {
        min-height: 42px;
        font-size: 12px;
        padding: 6px 4px;
      }

      .options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        padding: 8px;
      }

      .scene {
        padding: 10px;
        gap: 8px;
      }

      .scene-art { display: none; }
      .tag-row { gap: 5px; margin-bottom: 6px; }
      .tag { font-size: 11px; padding: 4px 6px; }
      .task-title { font-size: 21px; }
      .task-ru { margin-top: 5px; font-size: 14px; }
      .guest-box { margin-top: 8px; padding: 9px; }
      .guest-head { margin-bottom: 5px; }
      .guest-label { font-size: 11px; }
      .spoken { font-size: 16px; }
      .icon-button { width: 34px; height: 34px; min-width: 34px; }

      .card {
        min-height: 86px;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 7px;
        padding: 8px;
      }

      .choice-icon { width: 30px; height: 30px; }
      .choice-icon svg { width: 19px; height: 19px; }
      .choice-en { font-size: 13px; }
      .choice-ru { font-size: 11px; margin-top: 3px; }
      .feedback { margin: 0 8px 8px; padding: 9px; }
      .feedback h2 { font-size: 15px; }
      .feedback p { font-size: 13px; }

      .nav-row {
        padding: 0 8px 8px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 10h16"></path>
            <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
            <path d="M5 10v9h14v-9"></path>
            <path d="M9 14h6"></path>
          </svg>
        </div>
        <div>
          <h1>Hotel Shift Trainer</h1>
        </div>
      </div>
      <div class="score-strip">
        <div class="pill"><span>Score</span> <strong id="scoreNow">0</strong></div>
        <div class="pill"><span>Streak</span> <strong id="streakNow">0</strong></div>
        <button class="secondary" id="resetBtn" type="button" title="Сбросить прогресс">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v6h6"></path>
          </svg>
          Reset
        </button>
      </div>
    </header>

    <nav class="tabs" aria-label="Режимы">
      <button class="tab active" type="button" data-mode="flow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16"></path><path d="M4 12h10"></path><path d="M4 19h16"></path></svg>
        Flow
      </button>
      <button class="tab" type="button" data-mode="listen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        Listen
      </button>
      <button class="tab" type="button" data-mode="details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"></path><path d="M8 8h8"></path><path d="M8 12h8"></path><path d="M8 16h4"></path></svg>
        Details
      </button>
      <button class="tab" type="button" data-mode="problems">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 10 18H2L12 3z"></path><path d="M12 9v5"></path><path d="M12 17h.01"></path></svg>
        Problems
      </button>
      <button class="tab" type="button" data-mode="exam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3h8l4 4v14H4V3h4z"></path><path d="M14 3v5h5"></path><path d="m8 15 2 2 5-6"></path></svg>
        Exam
      </button>
    </nav>

    <section>
      <article class="stage" aria-live="polite">
        <div class="scene">
          <div class="scene-art" id="sceneArt" aria-hidden="true"></div>
          <div>
            <div class="tag-row">
              <span class="tag" id="modeTag">Flow</span>
              <span class="tag" id="levelTag">A2-B1</span>
              <span class="tag" id="stepTag">1 / 1</span>
            </div>
            <h2 class="task-title" id="taskTitle">Check-in opening</h2>
            <p class="task-ru" id="taskRu">Выбери первую профессиональную реплику.</p>
            <div class="guest-box">
              <div class="guest-head">
                <span class="guest-label">Guest says</span>
                <div class="actions">
                  <button class="icon-button" id="speakBtn" type="button" title="Прослушать">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
                  </button>
                  <button class="icon-button" id="revealBtn" type="button" title="Показать или скрыть текст гостя">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                </div>
              </div>
              <p class="spoken" id="spokenText">Good evening. I have a reservation under Petrova.</p>
            </div>
          </div>
        </div>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback">
          <h2 id="feedbackTitle">Good</h2>
          <p id="feedbackText">Explanation</p>
        </div>

        <div class="nav-row">
          <button class="secondary" id="shuffleBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
            Shuffle
          </button>
          <button class="primary" id="nextBtn" type="button">
            Next
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </button>
        </div>

        <div class="exam-result" id="examResult">
          <h2 id="examTitle">Exam complete</h2>
          <p id="examText">Result text</p>
        </div>
      </article>
    </section>
  </main>

  <script src="trainer-data.js"></script>
  <script>
    const icons = {
      reply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>',

      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 10 18H2L12 3z"></path><path d="M12 9v5"></path><path d="M12 17h.01"></path></svg>'

    const sceneSvgs = {
      checkin: '<svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="180" fill="#e7f3f0"/><rect x="18" y="95" width="184" height="45" rx="7" fill="#126c76"/><rect x="40" y="35" width="58" height="70" rx="8" fill="#fff"/><path d="M54 58h31M54 74h31M54 90h21" stroke="#126c76" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="63" r="24" fill="#f3bc4c"/><path d="M113 135c8-28 64-28 72 0" fill="#d9482f"/><path d="M139 65c8 8 18 8 25 0" stroke="#172126" stroke-width="4" stroke-linecap="round"/></svg>',

      problem: '<svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="180" fill="#f8ece9"/><path d="M110 25 188 150H32L110 25Z" fill="#d9482f"/><path d="M110 67v45" stroke="#fff" stroke-width="11" stroke-linecap="round"/><circle cx="110" cy="132" r="7" fill="#fff"/></svg>',
      details: '<svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="180" fill="#edf1f7"/><rect x="34" y="36" width="152" height="106" rx="8" fill="#fff"/><path d="M60 65h100M60 90h72M60 115h94" stroke="#2d6ca2" stroke-width="7" stroke-linecap="round"/><rect x="46" y="50" width="22" height="22" rx="4" fill="#f3bc4c"/><rect x="46" y="76" width="22" height="22" rx="4" fill="#126c76"/><rect x="46" y="102" width="22" height="22" rx="4" fill="#d9482f"/></svg>',
      listen: '<svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="180" fill="#ecf5f5"/><path d="M80 68 48 94H25v36h23l32 26V68Z" fill="#126c76"/><path d="M112 75c16 18 16 45 0 63M138 55c28 34 28 79 0 105" fill="none" stroke="#d9482f" stroke-width="9" stroke-linecap="round"/></svg>'
    };

    const fallbackTasks = [
      {
        id: 'flow-1', mode: 'flow', level: 'A2', scene: 'checkin', title: 'Check-in opening',
        ru: 'Гость подошел к стойке. Выбери первую профессиональную реплику.',
        spoken: 'Good evening. I have a reservation under Petrova.',
        formula: 'Greet + offer help + confirm reservation.',
        coach: ['Не начинай с цены или паспорта.', 'Сначала подтвердить бронь и имя.', 'Тон: friendly and professional.'],
        options: [
          ['Welcome. May I see your reservation number?', 'Нормально, но слишком резко для первой реплики.', false, 'Сначала лучше поприветствовать и подтвердить имя.'],

    const tasks = window.TRAINER_TASKS && window.TRAINER_TASKS.length ? window.TRAINER_TASKS : fallbackTasks;
    let currentAudio = null;

    const state = {
      mode: 'flow',
      index: 0,
      answered: false,
      selected: null,
      score: Number(localStorage.getItem('hst-score') || 0),
      streak: Number(localStorage.getItem('hst-streak') || 0),
      done: Number(localStorage.getItem('hst-done') || 0),
      right: Number(localStorage.getItem('hst-right') || 0),
      examDone: Number(localStorage.getItem('hst-exam') || 0),
      examRound: 0,
      examRight: 0,
      hideSpoken: false
    };

    const byId = (id) => document.getElementById(id);
    const modeTasks = () => tasks.filter((task) => task.mode === state.mode);
    const currentTask = () => modeTasks()[state.index % modeTasks().length];

    function saveProgress() {
      localStorage.setItem('hst-score', state.score);
      localStorage.setItem('hst-streak', state.streak);
      localStorage.setItem('hst-done', state.done);
      localStorage.setItem('hst-right', state.right);
      localStorage.setItem('hst-exam', state.examDone);
    }

    function updateStats() {
      byId('scoreNow').textContent = state.score;
      byId('streakNow').textContent = state.streak;
    }

    function optionIcon(optionText) {
      const lower = optionText.toLowerCase();
      if (lower.includes('passport') || lower.includes('name')) return icons.passport;
      if (lower.includes('bill') || lower.includes('euro') || lower.includes('fee') || lower.includes('pay')) return icons.money;
      if (lower.includes('key') || lower.includes('room')) return icons.key;
      if (lower.includes('check') || lower.includes('time') || lower.includes('late')) return icons.clock;
      if (lower.includes('sorry') || lower.includes('maintenance') || lower.includes('noise')) return icons.warn;
      return icons.reply;
    }

    function speak(text, task = currentTask()) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (task && task.audio) {
        currentAudio = new Audio(task.audio);
        currentAudio.play().catch(() => speakWithBrowserVoice(text));
        return;
      }
      speakWithBrowserVoice(text);
    }

    function speakWithBrowserVoice(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      utterance.rate = 0.92;
      speechSynthesis.speak(utterance);
    }

    function renderTask(autoSpeak = false) {
      const task = currentTask();
      state.answered = false;
      state.selected = null;
      state.hideSpoken = Boolean(task.hidden);
      byId('sceneArt').innerHTML = sceneSvgs[task.scene] || sceneSvgs.checkin;
      byId('modeTag').textContent = state.mode === 'exam' ? 'Exam' : task.mode[0].toUpperCase() + task.mode.slice(1);
      byId('levelTag').textContent = task.level;
      byId('stepTag').textContent = state.mode === 'exam' ? `${state.examRound + 1} / 10` : `${state.index + 1} / ${modeTasks().length}`;
      byId('taskTitle').textContent = task.title;
      byId('taskRu').textContent = task.ru;
      byId('spokenText').textContent = task.spoken;
      byId('spokenText').classList.toggle('hidden-text', state.hideSpoken);
      byId('feedback').className = 'feedback';
      byId('examResult').className = 'exam-result';
      byId('options').innerHTML = '';

      const shuffled = [...task.options].sort(() => Math.random() - 0.5);
      shuffled.forEach((option, idx) => {
        const button = document.createElement('button');
        button.className = 'card';
        button.type = 'button';
        button.dataset.correct = option[2] ? 'true' : 'false';
        button.dataset.why = option[3];
        button.dataset.ru = option[1];
        button.innerHTML = `
          <span class="choice-icon" aria-hidden="true">${optionIcon(option[0])}</span>
          <span class="choice-main">
            <span class="choice-en">${option[0]}</span>
            <span class="choice-ru">${option[1]}</span>
          </span>
        `;
        button.addEventListener('click', () => answer(button));
        byId('options').appendChild(button);
      });

      updateStats();
      if (autoSpeak || task.hidden) window.setTimeout(() => speak(task.spoken), 250);
    }

    function answer(button) {
      if (state.answered) return;
      state.answered = true;
      state.selected = button;
      const correct = button.dataset.correct === 'true';
      const allCards = [...document.querySelectorAll('.card')];
      allCards.forEach((card) => {
        card.disabled = true;
        if (card.dataset.correct === 'true') card.classList.add('correct');
      });
      button.classList.add(correct ? 'correct' : 'wrong');

      state.done += 1;
      if (state.mode === 'exam') state.examDone += 1;
      if (correct) {
        state.right += 1;
        state.score += 10 + Math.min(state.streak, 5);
        state.streak += 1;
        if (state.mode === 'exam') state.examRight += 1;
      } else {
        state.streak = 0;
      }
      if (state.mode === 'exam') state.examRound += 1;
      saveProgress();
      updateStats();

      const feedback = byId('feedback');
      feedback.className = `feedback show ${correct ? 'good' : 'bad'}`;
      byId('feedbackTitle').textContent = correct ? 'Good service move' : 'Not the best move';
      byId('feedbackText').textContent = button.dataset.why;

      if (state.mode === 'exam' && state.examRound >= 10) showExamResult();
    }

    function showExamResult() {
      const percent = Math.round((state.examRight / 10) * 100);
      byId('examResult').className = 'exam-result show';
      byId('examTitle').textContent = `Exam result: ${state.examRight} / 10`;
      byId('examText').textContent = percent >= 80
        ? 'Готовность хорошая: студент держит ресепшен-диалог, детали и жалобы. Теперь можно повторять слабые карточки на скорость.'
        : percent >= 60
          ? 'База есть, но еще нужно добрать стабильность: особенно числа, даты и complaint formula.'
          : 'Пока рано идти в экзаменационный режим. Лучше пройти Flow, Listen и Problems еще раз.';
    }

    function nextTask() {
      if (state.mode === 'exam' && state.examRound >= 10) {
        state.examRound = 0;
        state.examRight = 0;
        state.index = Math.floor(Math.random() * modeTasks().length);
        renderTask(true);
        return;
      }
      state.index = (state.index + 1) % modeTasks().length;
      renderTask(state.mode === 'listen' || state.mode === 'details');
    }

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((item) => item.classList.remove('active'));
        tab.classList.add('active');
        state.mode = tab.dataset.mode;
        state.index = 0;
        state.examRound = 0;
        state.examRight = 0;
        renderTask(state.mode === 'listen' || state.mode === 'details');
      });
    });

    byId('speakBtn').addEventListener('click', () => speak(currentTask().spoken));
    byId('revealBtn').addEventListener('click', () => {
      state.hideSpoken = !state.hideSpoken;
      byId('spokenText').classList.toggle('hidden-text', state.hideSpoken);
    });
    byId('nextBtn').addEventListener('click', nextTask);
    byId('shuffleBtn').addEventListener('click', () => {
      state.index = Math.floor(Math.random() * modeTasks().length);
      renderTask(true);
    });
    byId('resetBtn').addEventListener('click', () => {
      state.score = 0;
      state.streak = 0;
      state.done = 0;
      state.right = 0;
      state.examDone = 0;
      state.examRound = 0;
      state.examRight = 0;
      saveProgress();
      renderTask(false);
    });

    renderTask(false);
  </script>
</body>
</html>
