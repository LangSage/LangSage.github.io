<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospitality Survival Trainer</title>
  <style>
    :root {
      --ink: #172126;
      --muted: #5d6b72;
      --paper: #f7f6f0;
      --panel: #fff;
      --line: #d8dfd9;
      --brand: #126c76;
      --brand-dark: #0b4e56;
      --blue: #2d6ca2;
      --green: #1f8a5b;
      --red: #c74432;
      --gold: #efb84a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(130deg, rgba(18, 108, 118, .13), transparent 36%),
        linear-gradient(310deg, rgba(199, 68, 50, .10), transparent 31%),
        var(--paper);
    }

    button { font: inherit; color: inherit; }

    .shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 24px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 10px;
    }

    .back {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--brand-dark);
      font-weight: 900;
      text-decoration: none;
    }

    .back svg, .button svg, .icon-btn svg, .tab svg { width: 19px; height: 19px; }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 56px);
      line-height: .98;
      letter-spacing: 0;
    }

    .score {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .pill {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .82);
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 900;
      white-space: nowrap;
    }

    .pill span { color: var(--muted); font-weight: 750; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .tab {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .84);
      padding: 9px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 950;
      text-align: center;
    }

    .tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .stage {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 18px 48px rgba(23, 33, 38, .12);
      overflow: hidden;
    }

    .scene {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(18, 108, 118, .08), rgba(255,255,255,.68));
    }

    .art {
      min-height: 130px;
      border: 1px solid rgba(18, 108, 118, .18);
      border-radius: 8px;
      background: #eef6f4;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .art svg { width: 100%; height: 100%; min-height: 130px; display: block; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .tag {
      border-radius: 8px;
      padding: 5px 8px;
      background: rgba(18, 108, 118, .10);
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .title {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .task {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.42;
    }

    .guest {
      margin-top: 10px;
      border: 1px solid rgba(18, 108, 118, .22);
      border-radius: 8px;
      background: #fff;
      padding: 13px;
    }

    .guest-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 950;
    }

    .guest-text {
      margin: 0;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 900;
    }

    .actions { display: flex; gap: 7px; }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .options {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .choice {
      min-height: 104px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 11px;
      align-items: start;
      transition: transform 140ms ease, border-color 140ms ease;
    }

    .choice:hover {
      transform: translateY(-2px);
      border-color: rgba(18, 108, 118, .48);
    }

    .choice[disabled] {
      cursor: default;
      transform: none;
      opacity: .72;
    }

    .choice.correct {
      opacity: 1;
      border-color: rgba(31, 138, 91, .88);
      background: rgba(31, 138, 91, .08);
    }

    .choice.wrong {
      opacity: 1;
      border-color: rgba(199, 68, 50, .86);
      background: rgba(199, 68, 50, .08);
    }

    .choice-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--blue);
      background: rgba(45, 108, 162, .10);
      font-weight: 950;
      font-size: 20px;
    }

    .en { display: block; font-size: 17px; font-weight: 950; line-height: 1.25; overflow-wrap: anywhere; }
    .ru { display: block; color: var(--muted); margin-top: 6px; line-height: 1.35; font-size: 14px; }

    .feedback {
      display: none;
      margin: 0 12px 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .feedback.show { display: block; }
    .feedback.good { border-color: rgba(31, 138, 91, .45); background: rgba(31, 138, 91, .08); }
    .feedback.bad { border-color: rgba(199, 68, 50, .42); background: rgba(199, 68, 50, .08); }
    .feedback h2 { margin: 0 0 6px; font-size: 19px; }
    .feedback p { margin: 0; color: var(--muted); line-height: 1.45; }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px 12px;
    }

    .button {
      min-height: 46px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 950;
    }

    .button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    @media (max-width: 900px) {
      .top, .scene { grid-template-columns: 1fr; }
      .score { justify-content: flex-start; }
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 10px, 1200px); padding-top: 8px; }
      .back { margin-bottom: 5px; font-size: 14px; }
      h1 { font-size: 25px; }
      .top { gap: 8px; margin-bottom: 8px; }
      .score { gap: 6px; }
      .pill, .button { min-height: 34px; padding: 6px 9px; font-size: 13px; }
      .tabs { gap: 5px; margin: 8px 0; }
      .tab { min-height: 42px; padding: 6px 4px; font-size: 12px; }
      .scene { padding: 10px; gap: 8px; }
      .art { display: none; }
      .tag-row { gap: 5px; margin-bottom: 6px; }
      .tag { font-size: 11px; padding: 4px 6px; }
      .title { font-size: 21px; }
      .task { margin-top: 5px; font-size: 14px; }
      .guest { margin-top: 8px; padding: 9px; }
      .guest-head { margin-bottom: 5px; }
      .label { font-size: 11px; }
      .guest-text { font-size: 16px; }
      .icon-btn { width: 34px; height: 34px; }
      .options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; padding: 8px; }
      .choice { min-height: 86px; grid-template-columns: 30px minmax(0, 1fr); gap: 7px; padding: 8px; }
      .choice-icon { width: 30px; height: 30px; font-size: 16px; }
      .en { font-size: 13px; }
      .ru { font-size: 11px; margin-top: 3px; }
      .feedback { margin: 0 8px 8px; padding: 9px; }
      .feedback h2 { font-size: 15px; }
      .feedback p { font-size: 13px; }
      .nav { padding: 0 8px 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <a class="back" href="/tourism_hub/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
          Hub
        </a>
        <h1>Hospitality Survival Trainer</h1>
      </div>
      <div class="score">
        <div class="pill"><span>Score</span><strong id="score">0</strong></div>
        <div class="pill"><span>Done</span><strong id="done">0</strong></div>
        <button class="button" id="resetBtn" type="button">Reset</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Levels">
      <button class="tab active" type="button" data-level="1">1. Survival</button>
      <button class="tab" type="button" data-level="2">2. Polite</button>
      <button class="tab" type="button" data-level="3">3. Services</button>
      <button class="tab" type="button" data-level="4">4. Problems</button>
      <button class="tab" type="button" data-level="5">5. Shift</button>
    </nav>

    <section>
      <article class="stage" aria-live="polite">
        <div class="scene">
          <div class="art" id="art"></div>
          <div>
            <div class="tag-row">
              <span class="tag" id="levelTag">Level 1</span>
              <span class="tag" id="skillTag">Understand</span>
              <span class="tag" id="countTag">1 / 10</span>
            </div>
            <h2 class="title" id="title">Task</h2>
            <p class="task" id="task">Choose the best card.</p>
            <div class="guest">
              <div class="guest-head">
                <span class="label">Guest / Situation</span>
                <div class="actions">
                  <button class="icon-btn" id="speakSlow" type="button" title="Slow audio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15 9.5a4 4 0 0 1 0 5"></path></svg>
                  </button>
                  <button class="icon-btn" id="speakNormal" type="button" title="Normal audio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
                  </button>
                </div>
              </div>
              <p class="guest-text" id="guestText">Hello.</p>
            </div>
          </div>
        </div>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback">
          <h2 id="feedbackTitle">Good</h2>
          <p id="feedbackText">Explanation</p>
        </div>

        <div class="nav">
          <button class="button" id="shuffleBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
            Random
          </button>
          <button class="button primary" id="nextBtn" type="button">
            Next
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </button>
        </div>
      </article>
    </section>
  </main>

  <script>
    const icons = ['✓', '?', '!', '→'];
    const art = {
      front: '<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="160" fill="#e9f5f3"/><rect x="22" y="91" width="176" height="40" rx="7" fill="#126c76"/><rect x="45" y="32" width="56" height="68" rx="8" fill="#fff"/><path d="M58 53h30M58 70h30M58 87h21" stroke="#126c76" stroke-width="5" stroke-linecap="round"/><circle cx="153" cy="58" r="22" fill="#efb84a"/><path d="M119 131c8-29 62-29 70 0" fill="#c74432"/></svg>',
      service: '<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="160" fill="#eef2f8"/><rect x="43" y="50" width="134" height="72" rx="10" fill="#fff"/><path d="M68 78h84M68 99h60" stroke="#2d6ca2" stroke-width="7" stroke-linecap="round"/><circle cx="62" cy="126" r="13" fill="#efb84a"/><circle cx="157" cy="126" r="13" fill="#efb84a"/></svg>',
      problem: '<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="160" fill="#faece9"/><path d="M110 23 187 138H33L110 23Z" fill="#c74432"/><path d="M110 61v39" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="110" cy="120" r="6" fill="#fff"/></svg>',
      shift: '<svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="160" fill="#edf6ef"/><rect x="28" y="103" width="164" height="34" rx="7" fill="#1f8a5b"/><circle cx="75" cy="62" r="21" fill="#efb84a"/><circle cx="146" cy="62" r="21" fill="#2d6ca2"/><path d="M43 135c7-31 57-31 64 0M114 135c7-31 57-31 64 0" fill="#fff"/></svg>'
    };

    const levels = {
      1: {
        name: 'Survival',
        skill: 'Understand',
        art: 'front',
        coach: ['Студент учится понимать главную просьбу гостя.', 'Не нужно строить фразу самому: только выбрать смысл.', 'Подходит для самых слабых: одно действие на одну ситуацию.'],
        phrases: ['One moment, please.', 'Let me check.', 'I can help you with that.'],
        tasks: [
          ['Check-in', 'I would like to check in, please.', 'Что хочет гость?', [['Заселиться', 'check in', true, 'Правильно: check in = заселиться. Example: “I would like to check in.”'], ['Выселиться', 'check out', false, 'Ошибка: check out = выезд из отеля.'], ['Заказать такси', 'book a taxi', false, 'Ошибка: taxi не звучало.'], ['Пожаловаться', 'complaint', false, 'Ошибка: жалобы нет.']]],
          ['Check-out', 'I would like to check out.', 'Что хочет гость?', [['Выселиться', 'check out', true, 'Правильно: check out = выехать из отеля.'], ['Заселиться', 'check in', false, 'Ошибка: check in = заселиться.'], ['Завтрак', 'breakfast', false, 'Ошибка: breakfast не звучал.'], ['Парковка', 'parking', false, 'Ошибка: parking не звучал.']]],
          ['Passport', 'Here is my passport.', 'Что дает гость?', [['Паспорт', 'passport', true, 'Правильно: passport = паспорт. На ресепшене это важный документ.'], ['Ключ', 'key card', false, 'Ошибка: key card = карта от номера.'], ['Чек', 'receipt', false, 'Ошибка: receipt = чек.'], ['Багаж', 'luggage', false, 'Ошибка: luggage = багаж.']]],
          ['Breakfast', 'Is breakfast included?', 'О чем спрашивает гость?', [['Включен ли завтрак', 'included breakfast', true, 'Правильно: included = включен в стоимость/бронь.'], ['Где лифт', 'elevator', false, 'Ошибка: elevator не звучал.'], ['Нужна уборка', 'cleaning', false, 'Ошибка: cleaning не звучало.'], ['Нужен врач', 'doctor', false, 'Ошибка: doctor не звучал.']]],
          ['Wi-Fi', 'What is the Wi-Fi password?', 'Что нужно гостю?', [['Пароль от Wi-Fi', 'Wi-Fi password', true, 'Правильно: password = пароль.'], ['Номер комнаты', 'room number', false, 'Ошибка: room number не звучал.'], ['Поздний выезд', 'late check-out', false, 'Ошибка: late check-out не звучал.'], ['Такси', 'taxi', false, 'Ошибка: taxi не звучал.']]],
          ['Luggage', 'Can I leave my luggage here?', 'Что просит гость?', [['Оставить багаж', 'leave luggage', true, 'Правильно: leave my luggage = оставить багаж.'], ['Поменять номер', 'change room', false, 'Ошибка: room не звучал.'], ['Оплатить картой', 'pay by card', false, 'Ошибка: card не звучала.'], ['Прачечная', 'laundry', false, 'Ошибка: laundry не звучала.']]],
          ['Taxi', 'Could you book a taxi to the airport?', 'Что нужно сделать?', [['Заказать такси', 'book a taxi', true, 'Правильно: book a taxi = заказать такси.'], ['Распечатать чек', 'print receipt', false, 'Ошибка: receipt не звучал.'], ['Дать полотенца', 'send towels', false, 'Ошибка: towels не звучали.'], ['Разбудить утром', 'wake-up call', false, 'Ошибка: wake-up call не звучал.']]],
          ['Towels', 'Could you send extra towels to my room?', 'Что просит гость?', [['Дополнительные полотенца', 'extra towels', true, 'Правильно: extra towels = дополнительные полотенца.'], ['Дополнительные ключи', 'extra keys', false, 'Ошибка: keys не звучали.'], ['Дополнительный завтрак', 'extra breakfast', false, 'Ошибка: breakfast не звучал.'], ['Дополнительную ночь', 'extra night', false, 'Ошибка: night не звучала.']]],
          ['Receipt', 'Could I have a receipt, please?', 'Что хочет гость?', [['Чек / квитанцию', 'receipt', true, 'Правильно: receipt = чек или квитанция.'], ['Карту от номера', 'key card', false, 'Ошибка: key card не звучала.'], ['Меню', 'menu', false, 'Ошибка: menu не звучало.'], ['Апгрейд', 'upgrade', false, 'Ошибка: upgrade не звучал.']]],

      },
      2: {

        skill: 'Phrase',
        art: 'front',
        coach: ['Уровень учит заменять грубые фразы на сервисные.', 'Главная формула: could / may / let me / I’m sorry.', 'Студент видит, почему простая фраза звучит нормально или плохо.'],

        tasks: [

          ['Ask passport', 'Guest: What do you need from me?', 'Попроси паспорт.', [['Could I have your passport, please?', 'вежливо', true, 'Правильно: стандартная безопасная формула.'], ['Give passport.', 'грубо', false, 'Ошибка: звучит как приказ.'], ['Passport quickly.', 'резко', false, 'Ошибка: quickly давит на гостя.'], ['You passport me.', 'не английский', false, 'Ошибка: фраза не работает.']]],
          ['Ask room number', 'Guest: I want to check out.', 'Спроси номер комнаты.', [['May I have your room number, please?', 'профессионально', true, 'Правильно: room number нужен для check-out.'], ['Room number!', 'резко', false, 'Ошибка: слишком командно.'], ['Where is your room?', 'не то', false, 'Ошибка: нужен номер, не местоположение.'], ['You room number is?', 'неестественно', false, 'Ошибка: лучше “May I have...?”']]],

    const state = {
      level: '1',
      index: 0,
      answered: false,
      score: Number(localStorage.getItem('hst-survival-score') || 0),
      done: Number(localStorage.getItem('hst-survival-done') || 0),
      rightByLevel: JSON.parse(localStorage.getItem('hst-survival-right') || '{}'),
      doneByLevel: JSON.parse(localStorage.getItem('hst-survival-leveldone') || '{}')
    };

    const $ = (id) => document.getElementById(id);

    function currentLevel() { return levels[state.level]; }
    function currentTask() { return currentLevel().tasks[state.index % currentLevel().tasks.length]; }

    function save() {
      localStorage.setItem('hst-survival-score', state.score);
      localStorage.setItem('hst-survival-done', state.done);
      localStorage.setItem('hst-survival-right', JSON.stringify(state.rightByLevel));
      localStorage.setItem('hst-survival-leveldone', JSON.stringify(state.doneByLevel));
    }

    function speak(text, slow = false) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB';
      u.rate = slow ? 0.68 : 0.92;
      u.pitch = slow ? 0.95 : 1.02;
      speechSynthesis.speak(u);
    }

    function updateStats() {
      $('score').textContent = state.score;
      $('done').textContent = state.done;
    }

    function render() {
      const level = currentLevel();
      const task = currentTask();
      state.answered = false;
      $('art').innerHTML = art[level.art];
      $('levelTag').textContent = `Level ${state.level}: ${level.name}`;
      $('skillTag').textContent = level.skill;
      $('countTag').textContent = `${state.index + 1} / ${level.tasks.length}`;
      $('title').textContent = task[0];
      $('guestText').textContent = task[1];
      $('task').textContent = task[2];
      $('feedback').className = 'feedback';
      $('options').innerHTML = '';

      [...task[3]].sort(() => Math.random() - .5).forEach((opt, i) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.dataset.correct = opt[2] ? 'true' : 'false';
        button.dataset.why = opt[3];
        button.innerHTML = `<span class="choice-icon">${icons[i]}</span><span><span class="en">${opt[0]}</span><span class="ru">${opt[1]}</span></span>`;
        button.addEventListener('click', () => answer(button));
        $('options').appendChild(button);
      });
      updateStats();
    }

    function answer(button) {
      if (state.answered) return;
      state.answered = true;
      const correct = button.dataset.correct === 'true';
      [...document.querySelectorAll('.choice')].forEach((card) => {
        card.disabled = true;
        if (card.dataset.correct === 'true') card.classList.add('correct');
      });
      button.classList.add(correct ? 'correct' : 'wrong');

      state.done += 1;
      state.doneByLevel[state.level] = (state.doneByLevel[state.level] || 0) + 1;
      if (correct) {
        state.score += 10;
        state.rightByLevel[state.level] = (state.rightByLevel[state.level] || 0) + 1;
      }
      save();
      updateStats();

      $('feedback').className = `feedback show ${correct ? 'good' : 'bad'}`;
      $('feedbackTitle').textContent = correct ? 'Good service choice' : 'Careful';
      $('feedbackText').textContent = button.dataset.why;
    }

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
        tab.classList.add('active');
        state.level = tab.dataset.level;
        state.index = 0;
        render();
      });
    });

    $('speakSlow').addEventListener('click', () => speak(currentTask()[1], true));
    $('speakNormal').addEventListener('click', () => speak(currentTask()[1], false));
    $('nextBtn').addEventListener('click', () => {
      state.index = (state.index + 1) % currentLevel().tasks.length;
      render();
    });
    $('shuffleBtn').addEventListener('click', () => {
      state.index = Math.floor(Math.random() * currentLevel().tasks.length);
      render();
    });
    $('resetBtn').addEventListener('click', () => {
      state.score = 0;
      state.done = 0;
      state.rightByLevel = {};
      state.doneByLevel = {};
      save();
      render();
    });

    render();
  </script>
